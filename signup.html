<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spark — Sign up</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="stylesheet" href="auth.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="auth-wrapper">

    <div class="auth-brand">
      <i data-lucide="zap" class="auth-logo-icon"></i>
      <span class="auth-logo-text">Spark</span>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Create an account</h1>
      <p class="auth-sub">Start your Spark journey</p>

      <form class="auth-form" id="signup-form" novalidate>

        <div class="field">
          <label for="name">Full name</label>
          <input id="name" type="text" placeholder="Jane Doe" autocomplete="name" />
          <span class="field-error" id="name-error"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" />
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <div class="input-wrap">
            <input id="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" />
            <button type="button" class="toggle-confirm" id="toggle-confirm" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <span class="field-error" id="confirm-error"></span>
        </div>

        <button type="submit" class="auth-btn">Create account</button>

        <div class="auth-divider"><span>or</span></div>

        <button type="button" class="auth-btn auth-btn--outline google-btn">
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

      </form>
    </div>

    <p class="auth-footer">
      Already have an account? <a href="login.html" class="auth-link">Log in</a>
    </p>

  </div>

  <script>
    lucide.createIcons();

    function makeToggle(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      btn.addEventListener("click", () => {
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        btn.innerHTML = isHidden ? `<i data-lucide="eye-off"></i>` : `<i data-lucide="eye"></i>`;
        lucide.createIcons({ rootElement: btn });
      });
    }
    makeToggle("password", "toggle-pw");
    makeToggle("confirm", "toggle-confirm");

    document.getElementById("signup-form").addEventListener("submit", (e) => {
      e.preventDefault();
      window.location.href = "index.html";
    });
  </script>

</body>
</html>

</body>
</html>
