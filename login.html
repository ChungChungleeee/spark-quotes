<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spark — Log in</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="stylesheet" href="auth.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="auth-wrapper">

    <div class="auth-brand">
      <i data-lucide="zap" class="auth-logo-icon"></i>
      <span class="auth-logo-text">Spark</span>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in to your account</p>

      <div class="auth-error" id="auth-error" hidden></div>

      <form class="auth-form" id="login-form" novalidate>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <div class="field-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="auth-link" id="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="auth-btn" id="login-btn">Log in</button>

        <div class="auth-divider"><span>or</span></div>

        <button type="button" class="auth-btn auth-btn--outline google-btn" id="google-btn">
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

      </form>
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="signup.html" class="auth-link">Sign up</a>
    </p>

  </div>

  <script type="module">
    import {
      auth,
      googleProvider,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signInWithPopup,
      sendPasswordResetEmail,
    } from "./firebase.js";

    lucide.createIcons();

    // If already logged in, skip straight to the app
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "index.html";
    });

    // Password visibility toggle
    const pwInput  = document.getElementById("password");
    const toggleBtn = document.getElementById("toggle-pw");
    toggleBtn.addEventListener("click", () => {
      const isHidden = pwInput.type === "password";
      pwInput.type = isHidden ? "text" : "password";
      toggleBtn.innerHTML = isHidden ? `<i data-lucide="eye-off"></i>` : `<i data-lucide="eye"></i>`;
      lucide.createIcons({ rootElement: toggleBtn });
    });

    // Error display
    const errorBox = document.getElementById("auth-error");
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.hidden = false;
    }
    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = "";
    }

    function friendlyError(code) {
      switch (code) {
        case "auth/invalid-credential":
        case "auth/user-not-found":
        case "auth/wrong-password":
          return "Incorrect email or password.";
        case "auth/too-many-requests":
          return "Too many attempts. Try again later.";
        case "auth/user-disabled":
          return "This account has been disabled.";
        default:
          return "Something went wrong. Please try again.";
      }
    }

    // Email / password login
    const loginBtn = document.getElementById("login-btn");
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const email    = document.getElementById("email").value.trim();
      const password = pwInput.value;

      if (!email)    { document.getElementById("email-error").textContent = "Required"; return; }
      if (!password) { document.getElementById("password-error").textContent = "Required"; return; }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in…";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html";
      } catch (err) {
        showError(friendlyError(err.code));
        loginBtn.disabled = false;
        loginBtn.textContent = "Log in";
      }
    });

    // Google login
    document.getElementById("google-btn").addEventListener("click", async () => {
      clearError();
      try {
        await signInWithPopup(auth, googleProvider);
        window.location.href = "index.html";
      } catch (err) {
        if (err.code !== "auth/popup-closed-by-user") {
          showError(friendlyError(err.code));
        }
      }
    });

    // Forgot password
    document.getElementById("forgot-link").addEventListener("click", async (e) => {
      e.preventDefault();
      clearError();
      const email = document.getElementById("email").value.trim();
      if (!email) {
        document.getElementById("email-error").textContent = "Enter your email above first.";
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showError("✓ Password reset email sent. Check your inbox.");
      } catch (err) {
        showError(friendlyError(err.code));
      }
    });
  </script>

</body>
</html>
