<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spark — Quotes</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <span class="topbar-title">Spark</span>
    <div class="search" role="search">
      <input
        id="search"
        type="search"
        placeholder="Search quotes, authors…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search quotes"
      />
    </div>
  </header>

  <!-- Search results overlay -->
  <section id="results" class="results-overlay" hidden aria-live="polite"></section>

  <!-- Feed -->
  <div class="feed" id="feed"></div>

  <!-- Nav arrows -->
  <nav class="nav-arrows">
    <button class="nav-btn" id="nav-up" aria-label="Previous quote">&#8679;</button>
    <button class="nav-btn" id="nav-down" aria-label="Next quote">&#8681;</button>
  </nav>

  <script src="quotes.js"></script>
  <script src="app.js"></script>
</body>
</html>
